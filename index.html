<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Hunter Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>LinkedIn Hunter</h1>
      <p class="tagline">Extract hiring managers & recruiters from LinkedIn job links</p>
    </header>

    <main>
      <section class="card">
        <h2>Paste LinkedIn Job URL</h2>
        <div class="input-group">
          <input type="url" id="jobUrl" placeholder="https://www.linkedin.com/jobs/view/..." />
        </div>

        <div class="input-group">
          <label>
            <input type="checkbox" id="enableSubscribe" />
            Email me the results
          </label>
        </div>

        <div class="input-group hidden" id="subscribeGroup">
          <label for="subscribeEmail">Your Email</label>
          <input type="email" id="subscribeEmail" placeholder="you@example.com" />
        </div>

        <button id="startBtn" class="primary-btn">Start Extraction</button>
        <div id="status" class="status hidden"></div>

        <div class="progress-container hidden" id="progressContainer">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-info">
            <span id="progressText" class="progress-text"></span>
            <span id="progressTime" class="progress-time"></span>
          </div>
        </div>
      </section>

      <section class="card results-card hidden" id="resultsCard">
        <div class="results-header">
          <h2>Results</h2>
          <span id="resultCount" class="result-count"></span>
        </div>

        <div class="result-filters">
          <label><input type="checkbox" id="showVerified" /> Show verified emails only</label>
        </div>

        <div id="resultsList"></div>

        <div class="results-actions">
          <button id="copyEmailsBtn" class="secondary-btn">Copy Emails</button>
          <button id="exportCsvBtn" class="secondary-btn">Export CSV</button>
          <button id="sendResultsBtn" class="secondary-btn hidden">Send Results to My Email</button>
        </div>
      </section>
    </main>

    <footer>
      <p>LinkedIn Hunter — Paste a job link, get recruiter contacts</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
